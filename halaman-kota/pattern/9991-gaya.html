<!-- wp:html -->
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Raleway:wght@600;700;800&family=Mulish:wght@400;600;700;800&display=swap" rel="stylesheet"><style>
.ehc{--blue:#004AAD;--blue-2:#1684CF;--navy:#10213d;--navy-2:#1f3553;--gold:#DBC033;--ink:#10213d;--muted:#55627a;--line:#e3e9f3;--soft:#f4f7fc;--wa:#25D366;
  font-family:Mulish,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--ink);line-height:1.6;font-size:16px}
.ehc *{box-sizing:border-box}
.ehc h1,.ehc h2,.ehc h3{font-family:Poppins,sans-serif;line-height:1.25;margin:0 0 .5em;color:inherit}
.ehc h2{font-size:clamp(1.5rem,3vw,2rem)}
.ehc h3{font-size:1.1rem}
.ehc p{margin:0 0 1em}
.ehc a{color:var(--blue)}
.ehc img{max-width:100%;display:block}
.ehc-wrap{max-width:1140px;margin:0 auto;padding:0 16px}
.ehc-sec{padding:64px 0}
.ehc-sec.alt{background:var(--soft)}
.ehc-eyebrow{display:inline-block;font:600 .8rem Poppins,sans-serif;letter-spacing:.08em;text-transform:uppercase;color:var(--blue);margin-bottom:8px}
.ehc-lead{color:var(--muted);max-width:640px}
.ehc-btn{display:inline-flex;align-items:center;gap:8px;padding:13px 22px;border-radius:999px;font:600 .95rem Poppins,sans-serif;text-decoration:none;transition:transform .15s,box-shadow .15s;border:2px solid transparent}
.ehc-btn:hover{transform:translateY(-1px);box-shadow:0 6px 18px rgba(16,33,61,.18)}
.ehc-btn.wa{background:var(--wa);color:#fff}
.ehc-btn.pri{background:var(--blue);color:#fff}
.ehc-btn.ghost{border-color:currentColor;color:#fff}
.ehc-btn.out{border-color:var(--blue);color:var(--blue);background:#fff}
.ehc-btn svg{width:18px;height:18px;fill:currentColor}

/* breadcrumb */
.ehc-crumb{font-size:.85rem;color:rgba(255,255,255,.75);margin-bottom:20px}
.ehc-crumb a{color:#fff;text-decoration:none}

/* hero */
.ehc-hero{position:relative;color:#fff;background:var(--navy);overflow:hidden}
.ehc-hero::before{content:"";position:absolute;inset:0;background:url("https://res.cloudinary.com/v6gwkqrb/image/upload/c_fill,g_auto,w_1600,h_900,q_auto:eco,f_auto/1.jpg") center/cover}
.ehc-hero::after{content:"";position:absolute;inset:0;background:linear-gradient(100deg,rgba(16,33,61,.96) 0%,rgba(16,33,61,.85) 45%,rgba(0,74,173,.45) 100%)}
.ehc-hero .ehc-wrap{position:relative;z-index:1;display:grid;grid-template-columns:1.25fr .9fr;gap:40px;align-items:center;padding-top:56px;padding-bottom:64px}
.ehc-hero h1{font-size:clamp(1.9rem,4.4vw,3rem);font-weight:700}
.ehc-hero h1 em{font-style:normal;color:var(--gold)}
.ehc-hero .ehc-eyebrow{color:var(--gold)}
.ehc-hero p{color:rgba(255,255,255,.88);font-size:1.05rem}
.ehc-ctas{display:flex;flex-wrap:wrap;gap:12px;margin-top:24px}
.ehc-chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:22px}
.ehc-chip{font-size:.8rem;padding:6px 12px;border-radius:999px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.22)}

.ehc-next{background:#fff;color:var(--ink);border-radius:18px;padding:24px;box-shadow:0 20px 50px rgba(0,0,0,.25)}
.ehc-next small{font:600 .75rem Poppins,sans-serif;letter-spacing:.06em;text-transform:uppercase;color:var(--blue)}
.ehc-next .date{font:700 1.6rem Poppins,sans-serif;margin:6px 0 2px}
.ehc-next .meta{color:var(--muted);font-size:.92rem}
.ehc-next .price{display:flex;align-items:baseline;gap:8px;margin:18px 0;padding:14px 0;border-top:1px dashed var(--line);border-bottom:1px dashed var(--line)}
.ehc-next .price b{font:700 1.5rem Poppins,sans-serif;color:var(--blue)}
.ehc-next .price span{font-size:.85rem;color:var(--muted)}
.ehc-next .ehc-btn{width:100%;justify-content:center}

/* stats */
.ehc-stats{background:var(--blue);color:#fff}
.ehc-stats .ehc-wrap{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;padding-top:28px;padding-bottom:28px}
.ehc-stat b{display:block;font:700 1.5rem Poppins,sans-serif}
.ehc-stat span{font-size:.85rem;opacity:.85}

/* office */
.ehc-office{display:grid;grid-template-columns:1fr 1.1fr;gap:32px;align-items:stretch}
.ehc-card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:24px}
.ehc-dl{display:grid;gap:14px;margin:18px 0 22px}
.ehc-dl div{display:grid;grid-template-columns:28px 1fr;gap:10px}
.ehc-dl svg{width:22px;height:22px;fill:var(--blue);margin-top:2px}
.ehc-dl b{display:block;font-family:Poppins,sans-serif;font-size:.9rem}
.ehc-dl span{color:var(--muted);font-size:.95rem}
.ehc-map{border-radius:16px;overflow:hidden;border:1px solid var(--line);min-height:340px}
.ehc-map iframe{width:100%;height:100%;min-height:340px;border:0;display:block}
.ehc-route{margin-top:16px;padding:14px 16px;border-radius:12px;background:#eef4ff;font-size:.92rem}

/* schedule */
.ehc-head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:28px}
.ehc-rows{display:grid;gap:12px}
.ehc-row{display:grid;grid-template-columns:72px 1fr auto auto;gap:20px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px 18px;transition:border-color .15s}
.ehc-row:hover{border-color:var(--blue-2)}
.ehc-badge{text-align:center;background:var(--navy);color:#fff;border-radius:12px;padding:8px 0;font-family:Poppins,sans-serif}
.ehc-badge b{display:block;font-size:1.5rem;line-height:1}
.ehc-badge span{font-size:.75rem;letter-spacing:.06em;text-transform:uppercase;color:var(--gold)}
.ehc-row h3{margin:0 0 2px;font-size:1.02rem}
.ehc-row .meta{font-size:.88rem;color:var(--muted)}
.ehc-row .from{text-align:right}
.ehc-row .from small{display:block;font-size:.75rem;color:var(--muted)}
.ehc-row .from b{font:700 1.1rem Poppins,sans-serif;color:var(--blue)}
.ehc-row .ehc-btn{padding:10px 16px;font-size:.85rem}
.ehc-note{font-size:.85rem;color:var(--muted);margin-top:14px}

/* packages */
.ehc-tiers{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.ehc-tier{position:relative;display:flex;flex-direction:column;background:#fff;border:1px solid var(--line);border-radius:16px;padding:22px}
.ehc-tier.hot{border:2px solid var(--blue);box-shadow:0 12px 30px rgba(0,74,173,.12)}
.ehc-tag{position:absolute;top:-11px;left:20px;background:var(--gold);color:var(--navy);font:700 .7rem Poppins,sans-serif;padding:3px 10px;border-radius:999px;text-transform:uppercase;letter-spacing:.05em}
.ehc-stars{color:var(--gold);letter-spacing:2px;font-size:.9rem}
.ehc-tier .price{font:700 1.35rem Poppins,sans-serif;color:var(--blue);margin:6px 0 2px}
.ehc-tier .price small{display:block;font:400 .78rem Mulish,sans-serif;color:var(--muted)}
.ehc-tier ul{list-style:none;padding:0;margin:14px 0 18px;font-size:.9rem;color:var(--muted);display:grid;gap:6px;flex:1}
.ehc-tier li::before{content:"✓";color:var(--blue);font-weight:700;margin-right:8px}
.ehc-tier .ehc-btn{justify-content:center}

/* areas */
.ehc-areas{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px}
.ehc-area{padding:9px 16px;border-radius:999px;background:#fff;border:1px solid var(--line);font-weight:600;font-size:.92rem}

/* trust */
.ehc-grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.ehc-trust h3{display:flex;gap:10px;align-items:center}
.ehc-trust h3 i{flex:none;width:34px;height:34px;border-radius:10px;background:#eef4ff;color:var(--blue);display:grid;place-items:center;font-style:normal;font-size:1rem}
.ehc-trust p{color:var(--muted);font-size:.93rem;margin:0}
.ehc-legal{display:grid;grid-template-columns:1fr 1fr;gap:24px;margin-top:28px}
.ehc-kv{display:grid;grid-template-columns:auto 1fr;gap:8px 20px;font-size:.93rem}
.ehc-kv dt{color:var(--muted)}
.ehc-kv dd{margin:0;font-weight:700}
.ehc-warn{background:#fff8dc;border:1px solid #f0e2a0;border-radius:14px;padding:18px 20px;font-size:.93rem}

/* steps */
.ehc-steps{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;counter-reset:s}
.ehc-step{counter-increment:s;padding:22px;border-radius:16px;background:#fff;border:1px solid var(--line)}
.ehc-step::before{content:counter(s,decimal-leading-zero);display:block;font:700 1.6rem Poppins,sans-serif;color:var(--blue);margin-bottom:8px}
.ehc-step p{color:var(--muted);font-size:.92rem;margin:0}

/* gallery */
.ehc-gal{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.ehc-gal img{width:100%;aspect-ratio:16/10;object-fit:cover;border-radius:12px}
.ehc-gal img:first-child{grid-column:span 2;grid-row:span 2;height:100%;aspect-ratio:auto}

/* reviews */
.ehc-rating{display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:20px}
.ehc-rating b{font:700 2.4rem Poppins,sans-serif;color:var(--navy)}
.ehc-rating .ehc-stars{font-size:1.2rem}

/* faq */
.ehc-faq{max-width:820px;margin:0 auto}
.ehc-faq details{background:#fff;border:1px solid var(--line);border-radius:14px;margin-bottom:10px;padding:0 20px}
.ehc-faq summary{cursor:pointer;list-style:none;padding:18px 28px 18px 0;font:600 1rem Poppins,sans-serif;position:relative}
.ehc-faq summary::-webkit-details-marker{display:none}
.ehc-faq summary::after{content:"+";position:absolute;right:0;top:14px;font-size:1.4rem;color:var(--blue)}
.ehc-faq details[open] summary::after{content:"–"}
.ehc-faq details p{color:var(--muted);padding-bottom:18px;margin:0}

/* other cities */
.ehc-cities{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}
.ehc-city{display:block;text-decoration:none;color:var(--ink);background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px;transition:border-color .15s}
.ehc-city:hover{border-color:var(--blue)}
.ehc-city b{display:block;font-family:Poppins,sans-serif}
.ehc-city span{font-size:.82rem;color:var(--muted)}

/* closing */
.ehc-close{background:linear-gradient(120deg,var(--navy),var(--blue));color:#fff;text-align:center}
.ehc-close p{color:rgba(255,255,255,.85);max-width:560px;margin:0 auto 8px}
.ehc-close .ehc-ctas{justify-content:center}

/* sticky WA (mobile) */
.ehc-fab{display:none}

@media (max-width:960px){
  .ehc-hero .ehc-wrap,.ehc-office,.ehc-legal{grid-template-columns:1fr}
  .ehc-tiers,.ehc-steps{grid-template-columns:repeat(2,1fr)}
  .ehc-grid3{grid-template-columns:1fr}
  .ehc-cities{grid-template-columns:repeat(3,1fr)}
}
@media (max-width:640px){
  .ehc-sec{padding:48px 0}
  .ehc-stats .ehc-wrap{grid-template-columns:repeat(2,1fr)}
  .ehc-tiers,.ehc-steps{grid-template-columns:1fr}
  .ehc-row{grid-template-columns:60px 1fr;gap:12px 14px}
  .ehc-row .from{grid-column:2;text-align:left}
  .ehc-row .ehc-btn{grid-column:1/-1;justify-content:center}
  .ehc-gal{grid-template-columns:repeat(2,1fr)}
  .ehc-cities{grid-template-columns:repeat(2,1fr)}
  .ehc-ctas .ehc-btn{flex:1 1 100%;justify-content:center}
  .ehc-fab{display:flex;position:fixed;left:16px;right:16px;bottom:16px;z-index:999;justify-content:center;box-shadow:0 10px 24px rgba(0,0,0,.25)}
}

/* tabs jadwal */
.ehc-tabs>input{position:absolute;opacity:0;pointer-events:none}
.ehc-tabs>label{display:inline-flex;align-items:center;gap:6px;cursor:pointer;padding:10px 18px;margin:0 6px 16px 0;border-radius:999px;border:1px solid var(--line);background:#fff;font:600 .9rem Poppins,sans-serif;color:var(--ink)}
.ehc-tabs>label em{font-style:normal;font-size:.68rem;background:var(--gold);color:var(--navy);padding:2px 7px;border-radius:999px;text-transform:uppercase}
.ehc-tabs>input:checked+label{background:var(--navy);border-color:var(--navy);color:#fff}
.ehc-tabs>input:focus-visible+label{outline:2px solid var(--blue-2);outline-offset:2px}
.ehc-pane{display:none}
#ehc-t1:checked~.p1,#ehc-t2:checked~.p2{display:block}
.ehc-hero-new{display:inline-block;margin-top:18px;color:#fff;font-size:.92rem;text-decoration:none;border-bottom:1px dashed var(--gold)}
.ehc-hero-new b{color:var(--gold)}

/* judul bagian bersama */
.ehc-shead{margin-bottom:28px}
.ehc-shead .ehc-lead{margin-left:auto;margin-right:auto}
.ehc-wide{max-width:1240px}
/* galeri dokumentasi */
.ehc-doc{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.ehc-doc img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:12px}
@media (max-width:640px){.ehc-doc{grid-template-columns:repeat(2,1fr)}}
</style>
